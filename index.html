```html
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lautstärke</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #2F80ED;
      color: white;
      transition:
        background-color 0.4s ease,
        color 0.4s ease;
    }

    .app {
      min-height: 100vh;
      padding: 30px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .anzeige {
      flex: 1;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .symbol {
      font-size: clamp(70px, 12vw, 150px);
      line-height: 1;
      margin-bottom: 20px;
    }

    .titel {
      font-size: clamp(70px, 14vw, 180px);
      font-weight: 900;
      line-height: 1;

      text-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .untertitel {
      margin-top: 25px;

      font-size: clamp(20px, 3vw, 38px);
      font-weight: 600;
    }

    .buttons {
      width: 100%;
      max-width: 950px;

      display: flex;
      gap: 15px;
      justify-content: center;

      padding-bottom: 20px;
    }

    button {
      flex: 1;

      padding: 22px 15px;

      border: 4px solid rgba(255,255,255,0.7);
      border-radius: 18px;

      background: rgba(255,255,255,0.22);
      color: white;

      font-size: clamp(18px, 2.5vw, 30px);
      font-weight: bold;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    button:hover {
      background: rgba(255,255,255,0.35);
      transform: scale(1.03);
    }

    button.aktiv {
      background: white;
      color: #222;
      border-color: white;
      transform: scale(1.04);
    }

    body.sprechen button {
      color: #222;
      border-color: rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.35);
    }

    body.sprechen button:hover {
      background: rgba(255,255,255,0.55);
    }

    body.sprechen button.aktiv {
      background: #222;
      color: white;
      border-color: #222;
    }

    @media (max-width: 600px) {
      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="anzeige">

      <div class="symbol" id="symbol">
        🤫
      </div>

      <div class="titel" id="titel">
        Flüstern
      </div>

      <div class="untertitel" id="untertitel">
        Wir sprechen ganz leise miteinander.
      </div>

    </div>

    <div class="buttons">

      <button id="ruhe" onclick="setLevel('ruhe')">
        🤐 Ruhe
      </button>

      <button id="fluestern" class="aktiv" onclick="setLevel('fluestern')">
        🤫 Flüstern
      </button>

      <button id="sprechen" onclick="setLevel('sprechen')">
        💬 Sprechen
      </button>

    </div>

  </div>

  <script>

    function setLevel(level) {

      const titel =
        document.getElementById("titel");

      const symbol =
        document.getElementById("symbol");

      const untertitel =
        document.getElementById("untertitel");

      const body =
        document.body;


      document
        .querySelectorAll("button")
        .forEach(button =>
          button.classList.remove("aktiv")
        );

      body.classList.remove("sprechen");


      if (level === "ruhe") {

        body.style.backgroundColor = "#000000";
        body.style.color = "#FFFFFF";

        titel.textContent = "Ruhe";
        symbol.textContent = "🤐";
        untertitel.textContent = "Wir arbeiten ganz still.";

        document
          .getElementById("ruhe")
          .classList.add("aktiv");
      }


      if (level === "fluestern") {

        body.style.backgroundColor = "#2F80ED";
        body.style.color = "#FFFFFF";

        titel.textContent = "Flüstern";
        symbol.textContent = "🤫";
        untertitel.textContent = "Wir sprechen ganz leise miteinander.";

        document
          .getElementById("fluestern")
          .classList.add("aktiv");
      }


      if (level === "sprechen") {

        body.style.backgroundColor = "#F2C94C";
        body.style.color = "#222222";

        body.classList.add("sprechen");

        titel.textContent = "Sprechen";
        symbol.textContent = "💬";
        untertitel.textContent = "Wir dürfen miteinander sprechen.";

        document
          .getElementById("sprechen")
          .classList.add("aktiv");
      }

    }

  </script>

</body>
</html>
```
