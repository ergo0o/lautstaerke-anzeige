<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lautstärke</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      transition: background-color 0.3s ease;
    }

    /* HINTERGRUNDFARBEN */

    body.ruhe {
      background-color: #000000;
    }

    body.fluestern {
      background-color: #950606;
    }

    body.sprechen {
      background-color: #CC7722;
    }

    /* REGLER UNTEN RECHTS */

    .regler {
      position: fixed;
      right: 1.5vw;
      bottom: 1.5vw;

      width: clamp(320px, 24vw, 460px);

      display: flex;
      flex-direction: column;
      gap: 12px;

      padding: 14px;

      background: rgba(255, 255, 255, 0.94);

      border-radius: 18px;

      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);

      z-index: 10;
    }

    /* EINZELNE KNÖPFE */

    .knopf {
      width: 100%;
      min-height: 95px;

      display: flex;
      align-items: center;

      gap: 16px;

      padding: 10px 14px;

      background: white;

      border-radius: 14px;
      border: 4px solid #cccccc;

      cursor: pointer;

      font-size: clamp(24px, 1.8vw, 34px);
      font-weight: 800;

      text-align: left;

      transition:
        transform 0.15s ease,
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .knopf:hover {
      transform: scale(1.02);
    }

    /* BILDER IN DEN KNÖPFEN */

    .knopf img {
      width: 82px;
      height: 82px;

      object-fit: cover;

      border-radius: 10px;

      flex-shrink: 0;

      background-color: white;
    }

    /* BESCHRIFTUNG */

    .knopf span {
      flex: 1;
      line-height: 1.1;
    }

    /* FARBEN DER DREI KNÖPFE */

    .knopf-ruhe {
      border-color: #000000;
      color: #000000;
    }

    .knopf-fluestern {
      border-color: #950606;
      color: #950606;
    }

    .knopf-sprechen {
      border-color: #CC7722;
      color: #8A4F14;
    }

    /* AKTIVER KNOPF */

    body.ruhe .knopf-ruhe {
      background-color: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    body.fluestern .knopf-fluestern {
      background-color: #950606;
      color: #ffffff;
      border-color: #950606;
    }

    body.sprechen .knopf-sprechen {
      background-color: #CC7722;
      color: #222222;
      border-color: #CC7722;
    }

    /* KLEINERE BILDSCHIRME */

    @media (max-width: 700px) {

      .regler {
        width: 300px;
        right: 12px;
        bottom: 12px;
      }

      .knopf {
        min-height: 82px;
        font-size: 24px;
      }

      .knopf img {
        width: 68px;
        height: 68px;
      }
    }
  </style>
</head>

<body class="fluestern">

  <div class="regler">

    <button
      class="knopf knopf-ruhe"
      type="button"
      onclick="setLevel('ruhe')"
    >
      <img
        src="./ruhe.png"
        alt="Symbol für Ruhe"
      >
      <span>Ruhe</span>
    </button>


    <button
      class="knopf knopf-fluestern"
      type="button"
      onclick="setLevel('fluestern')"
    >
      <img
        src="./fluestern.png"
        alt="Symbol für Flüstern"
      >
      <span>Flüstern</span>
    </button>


    <button
      class="knopf knopf-sprechen"
      type="button"
      onclick="setLevel('sprechen')"
    >
      <img
        src="./sprechen.png"
        alt="Symbol für Sprechen"
      >
      <span>Sprechen</span>
    </button>

  </div>


  <script>
    function setLevel(level) {

      document.body.classList.remove(
        "ruhe",
        "fluestern",
        "sprechen"
      );

      document.body.classList.add(level);

      localStorage.setItem(
        "lautstaerkeLevel",
        level
      );
    }


    const gespeichert =
      localStorage.getItem("lautstaerkeLevel");


    if (
      gespeichert === "ruhe" ||
      gespeichert === "fluestern" ||
      gespeichert === "sprechen"
    ) {

      setLevel(gespeichert);

    } else {

      setLevel("fluestern");

    }
  </script>

</body>
</html>
