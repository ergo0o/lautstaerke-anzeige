<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lautstärke</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      transition: background-color 0.3s ease;
    }

    body.ruhe {
      background-color: #000000;
    }

    body.fluestern {
      background-color: #950606;
    }

    body.sprechen {
      background-color: #CC7722;
    }

    /* Kleiner Regler unten rechts */
    .regler {
      position: fixed;
      right: 1.2vw;
      bottom: 1.2vw;

      width: clamp(170px, 12vw, 230px);

      display: flex;
      flex-direction: column;
      gap: 6px;

      padding: 7px;

      background: rgba(255, 255, 255, 0.92);
      border-radius: 12px;

      box-shadow: 0 5px 18px rgba(0,0,0,0.25);

      z-index: 10;
    }

    .knopf {
      width: 100%;
      min-height: 50px;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 5px 7px;

      background: white;

      border-radius: 9px;
      border: 3px solid #ccc;

      cursor: pointer;

      font-size: clamp(14px, 1vw, 19px);
      font-weight: 800;

      text-align: left;

      transition:
        transform 0.15s ease,
        background-color 0.2s ease,
        color 0.2s ease;
    }

    .knopf:hover {
      transform: scale(1.02);
    }

    /* Bilder links in den Knöpfen */
    .knopf img {
      width: 42px;
      height: 42px;

      object-fit: cover;

      border-radius: 7px;

      flex-shrink: 0;
    }

    /* Farben der Knöpfe */
    .knopf-ruhe {
      border-color: #000000;
      color: #000000;
    }

    .knopf-fluestern {
      border-color: #950606;
      color: #950606;
    }

    .knopf-sprechen {
      border-color: #CC7722;
      color: #8A4F14;
    }

    /* Aktiver Knopf */
    body.ruhe .knopf-ruhe {
      background: #000000;
      color: white;
    }

    body.fluestern .knopf-fluestern {
      background: #950606;
      color: white;
    }

    body.sprechen .knopf-sprechen {
      background: #CC7722;
      color: #222222;
    }

    @media (max-width: 700px) {
      .regler {
        width: 190px;
        right: 10px;
        bottom: 10px;
      }

      .knopf img {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>

<body class="fluestern">

  <div class="regler">

    <button class="knopf knopf-ruhe" onclick="setLevel('ruhe')">
      <img src="ruhe.png" alt="">
      <span>Ruhe</span>
    </button>

    <button class="knopf knopf-fluestern" onclick="setLevel('fluestern')">
      <img src="fluestern.png" alt="">
      <span>Flüstern</span>
    </button>

    <button class="knopf knopf-sprechen" onclick="setLevel('sprechen')">
      <img src="sprechen.png" alt="">
      <span>Sprechen</span>
    </button>

  </div>

  <script>
    function setLevel(level) {
      document.body.classList.remove(
        "ruhe",
        "fluestern",
        "sprechen"
      );

      document.body.classList.add(level);

      localStorage.setItem(
        "lautstaerkeLevel",
        level
      );
    }

    const gespeichert =
      localStorage.getItem("lautstaerkeLevel");

    if (gespeichert) {
      setLevel(gespeichert);
    } else {
      setLevel("fluestern");
    }
  </script>

</body>
</html>
